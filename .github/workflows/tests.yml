# 362 tests that only run when someone remembers are not a safety net.
#
# Deliberately narrow: this runs the suite on the Python the project
# actually targets, and nothing else. No matrix across five versions
# nobody uses, no coverage gate that turns into a number people game.
#
# The browser tests are included because they have caught real
# regressions — fonts silently falling back, a page scrolling sideways
# at 1024px — and those are invisible to every other kind of test here.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install the browser Playwright needs
        run: python -m playwright install --with-deps chromium

      # The shortlisting model is ~30MB from HuggingFace. Cached, because
      # re-downloading it on every push is rude to a free service and
      # slow for us. Its absence is not fatal — the tests that need it
      # skip themselves and the rest still run.
      - name: Cache the shortlisting model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('requirements.txt') }}

      - name: Warm up the shortlisting model
        run: python run.py warm-up
        continue-on-error: true

      - name: Run the suite
        run: python -m pytest tests -q
        env:
          # No real keys in CI. Every test that touches a paid service
          # intercepts the network — if one ever starts making a real
          # call, it fails here rather than quietly spending money.
          CAREERLOOP_SECRET: ci-not-a-real-secret
