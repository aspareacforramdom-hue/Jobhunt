# ============================================================
# WHERE TO LOOK — India-first
# ============================================================

# NOTE: search_terms and locations are NOT here any more.
# They are per-user, generated by that user's calibrate step and stored
# on their profile. A shared list would search for one person's career
# on behalf of all three. The scanner runs the UNION of every user's
# terms, stores each listing once, then scores it separately per user.

# LAYER A: Aggregators via JobSpy (free, one call, concurrent)
# Tier 2 reliability: works, but breaks without warning.
jobspy:
  enabled: false   # flip on when running from your home IP
  sites: ["linkedin", "indeed", "google"]
  country_indeed: "India"
  results_wanted: 40
  hours_old: 48          # only fresh listings
  # Fallback locations, used only for a user whose profile names none.
  default_locations:
    - "Mumbai, India"
    - "Bengaluru, India"

# LAYER B: Direct ATS — highest signal, zero scraping fragility
# Clean public JSON endpoints. No ToS problem, no bot protection, and
# it is the only tier that never breaks — so breadth here is the
# cheapest coverage this tool can buy.
#
# Every slug below was verified live against its API, not taken from a
# search result. Note phonepe is on GREENHOUSE — it sat under `lever`
# for months and 404'd on every single scan.
#
# To add a company: find its careers page, look at the URL, and take the
# slug. boards.greenhouse.io/SLUG, jobs.lever.co/SLUG, or
# jobs.ashbyhq.com/SLUG. A wrong slug logs one line and is skipped.
ats_targets:
  greenhouse:
    - phonepe          # was miscategorised under lever
    - postman
    - inmobi
    - glance
    - slice
    - groww
    - springboard
    - newton
  lever:
    - paytm
    - meesho
    - porter
    - zeta
    - mindtickle
    - epifi
    - cred
  ashby:
    - navi
    - atlan

  # Two more free, no-auth ATS platforms. Same deal as the three above:
  # find the careers page, take the slug from the URL.
  #   jobs.smartrecruiters.com/SLUG   ->  smartrecruiters
  #   apply.workable.com/SLUG         ->  workable
  #
  # Empty by default because a slug has to be verified to be worth
  # anything — a wrong one logs a line and is skipped, but a right one
  # is free coverage forever. Add the Indian employers you care about.
  # Both verified live: probing the public endpoint returned real jobs.
  # swiggy is the interesting one — Firecrawl was being PAID to scrape
  # careers.swiggy.com and returned 0 listings on every measured scan,
  # while Swiggy publishes its whole board on this free API.
  smartrecruiters:
    - swiggy          # 46 live jobs, free (was: 0 via paid Firecrawl)
    - freshworks      # 153 live jobs, free
  workable: []

# LAYER B2: Firecrawl Cloud — the long tail.
# Covers what neither the ATS JSON nor Apify reaches: job boards this
# tool has no adapter for, and employers whose careers page is bespoke
# (Darwinbox, Keka, Zoho Recruit, hand-rolled).
#
# Cloud only, deliberately. Self-hosted Firecrawl omits the proprietary
# anti-bot layer, so it fetches with plain Playwright and gets
# fingerprinted by exactly the protection that makes Naukri hard.
#
# COST: search is billed per result set, scraping per page. So this
# searches cheaply and scrapes almost nothing — full text is bought
# AFTER the prefilter, for survivors only. With the caps below a scan
# costs roughly 12 search credits + up to 25 page credits.
# No-ops entirely without FIRECRAWL_API_KEY.
firecrawl:
  enabled: true
  # OFF after live testing. Open-web search returns job-board INDEX
  # pages ("578 Brand Manager jobs in Mumbai — LinkedIn"), not
  # individual postings, and the aggregators worth scraping — LinkedIn,
  # Glassdoor, Indeed — return 403. Naukri via Apify already covers that
  # ground properly, with full descriptions. Turn back on only if you
  # find a query shape that surfaces postings rather than search pages.
  search_enabled: false
  results_per_term: 10
  max_terms_per_scan: 6
  max_enrich_per_scan: 25    # full-text fetches, post-prefilter only
  max_pages_per_scan: 15
  # This is where Firecrawl earns its place: employers whose careers
  # page is bespoke, so neither the ATS JSON nor Naukri reaches them.
  # Verified working; note descriptions from these pages are short, so
  # the scorer judges them on less than it gets from Naukri.
  # Swiggy was here and produced 0 listings on every measured scan while
  # costing a page credit each time — its careers page is a JavaScript
  # shell. It is now fetched free via SmartRecruiters (46 live jobs).
  #
  # The lesson generalises: before paying to scrape a careers page, probe
  # the five free ATS APIs with the company's slug. Most Indian tech
  # employers are on one of them.
  career_pages: []

# LAYER C: Apify — the PRIMARY path for Naukri, not the fallback.
# Naukri's bot protection changes monthly and already returned
# "406 recaptcha required" from a cloud IP during testing. A scan that
# silently breaks is worse than one that costs ~$7/month, so the paid,
# maintained actor leads and JobSpy is the free fallback behind it.
# Absent APIFY_TOKEN the scanner degrades to tiers 1-2 and says so.
# Billed per event, so results_wanted is a real cost lever: each job
# fetched with fetch_details on costs more than a bare listing. The free
# Apify tier is $5/month — at 40 jobs per search term across three
# users' terms, that is comfortable but not unlimited.
apify:
  enabled: true           # no-ops without APIFY_TOKEN in the environment
  naukri_actor: "muhammetakkurtt/naukri-job-scraper"

  # ---- what one scan is allowed to cost -------------------------------
  # A measured scan on the old settings cost ~$20.82: 18 searches x 50
  # jobs x (listing + full description), of which the shortlister then
  # rejected 97%. The $5 credit ran out around the 6th of 18 searches,
  # mid-run, which is why Naukri data never properly arrived.
  max_spend_per_scan_usd: 1.50   # hard ceiling; searches are trimmed to fit
  max_terms_per_scan: 6          # rotates across scans, so nobody is starved

  # Actor list prices, FREE tier, read from Apify's API on 2026-08-16.
  # Only used to estimate before spending. Update if the actor changes.
  prices:
    run_init_usd: 0.01
    standard_job_usd: 0.005
    detailed_job_usd: 0.01

  # ---- seed once, then daily deltas -----------------------------------
  # The first time a keyword is ever searched there is no history in the
  # pool, so that run opens the window wide and takes a deep slice. Every
  # run after it asks only for what has appeared since.
  #
  # This is the fix for buying the same listing over and over: dedup
  # happens AFTER billing, so a wide window scanned daily pays for a
  # month of jobs every single day and bins all but the newest.
  #
  # Which keywords are already seeded is remembered in the database, so
  # a restart never re-buys the history. The deep pass is the expensive
  # one — the ceiling below spreads it over as many scans as it needs.
  backfill_results_wanted: 50   # deep first pass, per keyword, once
  backfill_freshness: "30"      # how far back that first pass reaches

  # ---- how much to buy ------------------------------------------------
  results_wanted: 20      # was 50. The actor's schema shows NO minimum;
                          # the old comment claiming it rejects <50 is
                          # unsupported. If a run fails, put this back.
  fetch_details: false    # phase 1 buys titles only — a third of the price.
                          # The shortlister reads titles anyway, and the
                          # descriptions the scorer needs are bought after
                          # the shortlist, for survivors only.
  freshness: "1"          # days: all | 30 | 15 | 7 | 3 | 1
                          # Was 7 with daily scans, so the same listing was
                          # bought up to seven times before dedup binned it.
  company_jobs_only: true # exclude consultant/staffing reposts. Free win.

# Naukri's own server-side filters, by numeric id. Filtering on THEIR
# side means never paying for the noise — the actor bills per result
# handed back. `calibrate` fills this in per user; these are the
# fallbacks, and a hand-written entry here always wins.
#
# department:    9 Marketing & Communication, 10 Product Management,
#                3 Data Science & Analytics, 5 Engineering - Software & QA
# role_category: 1050 Marketing, 1048 Digital Marketing,
#                1028 Software Development, 1018 BI & Analytics
# work_mode:     remote | hybrid | office | temporary_wfh
# company_type:  62 Startup, 213 Foreign MNC, 217 Indian MNC, 211 Corporate
#
# NOT here on purpose: experience and salary. This tool ranks stretch
# roles above safe ones, so filtering to someone's current level would
# delete the roles it exists to find; and a salary filter drops every
# "not disclosed" listing, which on Naukri is most of the good ones.
naukri_filters: {}

# LAYER D2: LinkedIn via Apify.
#
# Kept despite the ATS boards covering much of the same ground, because
# LinkedIn carries things nothing else does: the recruiter behind the
# posting, the applicant count, and Easy Apply. Some employers post
# there and nowhere else.
#
# THE COST SHAPE IS THE OPPOSITE OF NAUKRI'S. Naukri bills purely per
# result, so narrow searches are cheap and you want many. This actor
# bills per result with a FLOOR — "minimum 150 results when using
# pay-per-result billing" — so every run costs at least 150 results
# whether you needed 150 or 20. Eighteen narrow keyword runs would pay
# eighteen floors.
#
# So this makes ONE run per scan carrying every keyword. The actor pairs
# each keyword with each location itself, and the free local shortlister
# does the precision work afterwards.
linkedin:
  enabled: false          # flip on once you have credit; costs ~$0.11/scan
  actor: "cheap_scraper/linkedin-job-scraper"
  max_items: 150          # the billing floor — asking for less saves nothing
  backfill_max_items: 500 # the one deep first run; ~500 is LinkedIn's practical cap
  freshness: "1"          # 1 | 7 | 30 days, mapped to LinkedIn's own windows
  billing_floor: 150
  max_spend_per_scan_usd: 0.60
  prices:                 # FREE tier, read from Apify's API on 2026-08-16
    run_start_usd: 0.005
    result_usd: 0.0007

# Two kinds of LinkedIn filter, and the difference is money.
#
# Applied by LINKEDIN, so non-matching jobs are never returned and never
# billed — these genuinely save:
#     jobType, workType, filterUnder10Applicants, filterEasyApply,
#     companyInclude
#
# Applied by the ACTOR after collection — the docs say "jobs are still
# collected and counted toward billing". These improve what reaches the
# board and save nothing:
#     jobFunctionInclude, jobIndustryInclude, excludeRecruitingAgencies,
#     jobTitleExclude, companyExclude, subLocationExclude
#
# Not offered here on purpose: experienceLevel and salaryBase. Same
# refusal as Naukri — this tool ranks stretch roles above safe ones.
linkedin_filters:
  jobType: ["full-time"]
  excludeRecruitingAgencies: true

# LAYER E: employer reviews (AmbitionBox via Apify) — ON DEMAND.
#
# This used to run during every scan: two paid actor runs for the top
# ten companies PER USER. Measured, that was 12 companies and $7.14 on a
# single scan, buying themed review summaries for employers nobody had
# opened yet — and the reviews actor charges a $0.05 start fee on top of
# every review it returns.
#
# The detail page has a "Look up reviews" button, so the same money now
# buys reviews for companies someone is actually reading about. Basic
# star ratings still arrive free with Naukri listings, as before.
#
# Turn this on only if you would rather pay up front than wait a few
# seconds when you open a role.
reviews:
  enrich_during_scan: false
  reviews_per_company: 20   # was 60; summarize() only reads ~12KB anyway

# LAYER D: Government (optional, off by default)
govt:
  enabled: false
  note: "Turn on only if you actually want govt roles. Adds noise."
